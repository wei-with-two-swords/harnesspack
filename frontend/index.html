<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" data-theme-icon="/favicon" data-icon-ext="svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180-light.png" data-theme-icon="/favicon-180" data-icon-ext="png" />
    <meta
      name="description"
      content="HarnessPack：DeepSeek Harness（DSH）插件排行榜，每日快照真实 star 增速，含近 24 小时、区间增速、总榜、名次、最新、稳健与 NPM 榜。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HarnessPack" />
    <meta property="og:title" content="HarnessPack · DSH 插件榜单" />
    <meta
      property="og:description"
      content="收录上万个 DeepSeek Harness 插件，按真实 star 增速排名，每天 UTC 00:10 抓取一次，不美化、不回填、异常单独标注。"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HarnessPack · DSH 插件榜单" />
    <script>
      // Apply saved preferences before first paint. Theme defaults to light; language to English.
      (function () {
        try {
          var t = localStorage.getItem('harnesspack-theme');
          var dark = t === 'dark';
          document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
          var suffix = dark ? 'dark' : 'light';
          document.querySelectorAll('link[data-theme-icon]').forEach(function (link) {
            var ext = link.getAttribute('data-icon-ext') || 'png';
            link.href = link.getAttribute('data-theme-icon') + '-' + suffix + '.' + ext;
          });
          var lang = localStorage.getItem('harnesspack-lang');
          document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
        } catch (e) {}
      })();
    </script>
    <title>HarnessPack · DSH 插件榜单</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
