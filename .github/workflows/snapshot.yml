name: snapshot

on:
  schedule:
    # 00:10 UTC every day, after GitHub's daily star recalculation settles
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual re-runs on the same UTC day must not fail: merge instead of overwrite.
          TODAY=$(date -u +%F)
          if [ -f "data/snapshots/$TODAY.json" ]; then
            echo "::notice::snapshot for $TODAY already exists; filling any missing repos"
            python scripts/snapshot.py --missing-only
          else
            python scripts/snapshot.py
          fi

      - name: Validate snapshots
        run: python scripts/validate.py

      - name: Commit and push
        run: |
          git config user.name "harnesspack-bot"
          git config user.email "harnesspack-bot@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%F)"
          git push
