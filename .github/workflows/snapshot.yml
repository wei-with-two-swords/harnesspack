name: snapshot

on:
  schedule:
    # 00:10 UTC every day, after GitHub's daily star recalculation settles
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so a re-run of an older commit can still work on main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync catalog
        continue-on-error: true
        run: python scripts/vendor_catalog.py

      - name: Build seed
        run: python scripts/build_seed.py

      - name: Fetch snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.SNAPSHOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Always work on top of the current main, even when this job is a
          # re-run of an older commit (re-running uses the original SHA).
          git fetch origin main
          git checkout -B work origin/main
          TODAY=$(date -u +%F)
          if git cat-file -e "HEAD:data/snapshots/$TODAY.json" 2>/dev/null; then
            echo "::notice::origin/main already has $TODAY snapshot; filling any missing repos"
            python scripts/snapshot_graphql.py --missing-only
          else
            python scripts/snapshot_graphql.py
          fi

      - name: Validate snapshots
        run: python scripts/validate.py

      - name: Commit and push
        run: |
          git config user.name "harnesspack-bot"
          git config user.email "harnesspack-bot@users.noreply.github.com"
          git add data/catalog data/plugins.seed.json data/snapshots
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%F)"
          # Another run may have pushed meanwhile; rebase once and retry.
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
