# HarnessPack — harnesspack.dev
# 安装：复制到 /etc/nginx/sites-available/harnesspack.dev，
#       ln -s ../sites-available/harnesspack.dev /etc/nginx/sites-enabled/，
#       nginx -t && systemctl reload nginx。
#
# 证书：certbot certonly --webroot -w /var/www/certbot -d harnesspack.dev -d www.harnesspack.dev
#      然后用 deploy/scripts/certbot-deploy.sh 配置续期后 reload。

upstream harnesspack_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name harnesspack.dev www.harnesspack.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://harnesspack.dev$request_uri;
    }
}

server {
    # Ubuntu 24.04 自带 nginx 1.24，http2 只能写在 listen 参数里
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name harnesspack.dev www.harnesspack.dev;

    ssl_certificate     /etc/letsencrypt/live/harnesspack.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harnesspack.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/harnesspack/frontend/dist;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 构建产物带 hash，可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 自托管的第三方静态资源，文件名带版本号，可长缓存
    location /vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 动态生成：徽章、分享图、RSS、插件页服务端 meta
    location /badge/ {
        proxy_pass http://harnesspack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location /og/ {
        proxy_pass http://harnesspack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location = /feed.xml {
        proxy_pass http://harnesspack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Keep /plugins (no trailing slash) on the SPA instead of nginx's automatic 301.
    location = /plugins {
        try_files $uri /index.html;
    }

    location /plugins/ {
        proxy_pass http://harnesspack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location /api/ {
        proxy_pass http://harnesspack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 以下三个由 API 动态生成
    location = /robots.txt {
        proxy_pass http://harnesspack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://harnesspack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        rewrite ^ /api/v1/health break;
        proxy_pass http://harnesspack_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态图标直接由 nginx 提供
    location ~ ^/(favicon\.ico|favicon-(32|64|180)\.png|whale\.png)$ {
        try_files $uri =404;
    }

    # 其余页面全部交给 API 渲染：按路由注入 title/description/canonical/JSON-LD，
    # 未知路径返回 404；静态资源仍走上面的 /assets/ 与 /vendor/。
    location / {
        proxy_pass http://harnesspack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
